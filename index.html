<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>待办事项列表</title><script defer="defer" src="app.bundle.js"></script></head><body><div id="app-container"><h1>待办事项列表</h1><section id="project-section"><h2>项目</h2><div id="project-list"></div><input id="new-project-name" placeholder="新项目名称"/> <button id="add-project-btn">添加项目</button></section><section id="todo-section"><h2>待办事项</h2><div id="todo-list"></div><h3>添加新待办事项</h3><input id="todo-title" placeholder="标题"/> <textarea id="todo-desc" placeholder="描述"></textarea> <input type="date" id="todo-due-date"/> <select id="todo-priority"><option value="low">低优先级</option><option value="medium" selected="selected">中优先级</option><option value="high">高优先级</option></select> <button id="add-todo-btn">添加待办事项</button></section></div></body></html>
